[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "counterlab-runner"
version = "0.1.0"
description = "Constrained generated-adapter runner for CounterLab"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
counterlab_runner = ["contained-runtime-policy.json"]
