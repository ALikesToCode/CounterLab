    - region [ref=f8e185] [box=14,7644,347,1252]:
        - generic [ref=f8e186] [box=14,7717,347,442]:
            - paragraph [ref=f8e187] [box=14,7717,347,19]: What the evidence can claim
            - heading "Bounded proof, visible limitations." [level=2] [ref=f8e188] [box=14,7753,347,76]
            - list [ref=f8e189] [box=14,7868,347,291]:
                - listitem [ref=f8e190] [box=14,7868,347,67]: ✓Exact notebook cells and hashes bind the learner's claim.
                - listitem [ref=f8e191] [box=14,7949,347,67]: ✓A verified result cannot appear before Prediction is locked.
                - listitem [ref=f8e192] [box=14,8030,347,67]: ✓Transfer is fixed-code scored; no model grades free-form prose.
                - listitem [ref=f8e193] [box=14,8111,347,48]: ✓The original notebook is never overwritten.
        - complementary [ref=f8e194] [box=14,8207,347,617]:
            - text: Known boundary
            - heading "CounterLab does not claim universal notebook support." [level=3] [ref=f8e195] [box=51,8275,280,98]
            - paragraph [ref=f8e196] [box=51,8372,280,279]: It supports two reviewed ML Subject Packs and refuses unknown packages, arbitrary code execution, unsupported patch shapes, and insufficient evidence. A Proof Capsule proves integrity and scoped verification—not global mastery or formal sandbox security. The hosted Codex launch has a credential-and-privilege boundary. No exact released filesystem generation read-isolation status is available, so live authority remains unproven.
            - region [ref=f8e197] [box=51,8677,280,102]:
                - heading "Exact public build" [level=4] [ref=f8e198] [box=51,8700,280,18]
                - paragraph [ref=f8e199] [box=51,8732,280,47]: Release identity is unbound. Treat live qualification as unproven.
