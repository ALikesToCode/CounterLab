    - region [ref=f8e114] [box=14,4364,347,1574]:
        - generic [ref=f8e115] [box=14,4461,347,267]:
            - paragraph [ref=f8e116] [box=14,4461,347,40]: Established pedagogy, a different evidence layer
            - heading "What CounterLab builds on—and adds." [level=2] [ref=f8e117] [box=14,4511,347,76]
            - paragraph [ref=f8e118] [box=14,4597,347,116]: CounterLab does not claim to invent predict-before-reveal. Its narrower contribution is binding that learning loop to a supported artifact, fixed computation, frozen verification, deterministic transfer, and a portable evidence record.
        - generic [ref=f8e119] [box=14,4780,347,1062]:
            - article [ref=f8e120] [box=14,4781,347,374]:
                - generic [ref=f8e121] [box=38,4805,299,15]: Learning-science lineage
                - heading "Predict–Observe–Explain and Peer Instruction" [level=3] [ref=f8e122] [box=38,4862,299,93]
                - paragraph [ref=f8e123] [box=38,4955,299,116]: These approaches establish prediction and commitment before the reveal. CounterLab carries that lineage into a machine-checked, artifact-bound loop; the pedagogy itself is not new.
                - generic [ref=f8e124] [box=38,5087,299,44]:
                    - link "LAMS POE overview" [ref=f8e125] [cursor=pointer] [box=38,5087,125,44]:
                        - /url: https://teach.lams.es/pedagogies/poe
                    - link "Peer Instruction review" [ref=f8e126] [cursor=pointer] [box=181,5087,141,44]:
                        - /url: https://www.frontiersin.org/journals/education/articles/10.3389/feduc.2018.00033/full
            - article [ref=f8e127] [box=14,5156,347,343]:
                - generic [ref=f8e128] [box=38,5180,299,15]: Closest lesson pattern
                - heading "LAMS Predict–Observe–Explain" [level=3] [ref=f8e129] [box=38,5237,299,62]
                - paragraph [ref=f8e130] [box=38,5299,299,116]: LAMS already pairs prediction, confidence, explanation, and reflection. CounterLab adds a fixed transfer gate and separates learner-facing Reasoning Diff from machine-facing Proof Capsule.
                - link "Inspect the prior-art template" [ref=f8e131] [cursor=pointer] [box=38,5430,299,44]:
                    - /url: https://teach.lams.es/pedagogies/poe
            - article [ref=f8e132] [box=14,5499,347,342]:
                - generic [ref=f8e133] [box=38,5523,299,15]: Closest notebook tooling
                - heading "NBLyzer and sklearn-diagnose" [level=3] [ref=f8e134] [box=38,5580,299,62]
                - paragraph [ref=f8e135] [box=38,5642,299,116]: "These tools detect or diagnose notebook and model problems. CounterLab's scoped difference is learner action: predict, inspect one controlled test, map a Boundary, and pass transfer before Repair unlocks."
